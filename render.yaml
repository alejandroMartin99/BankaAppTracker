# BankaAppTracker - Backend en Render
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: bankaapp-backend
    runtime: python
    rootDir: Backend

    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ENABLE_DIAGNOSTIC_ENDPOINT
        value: "false"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Orígenes permitidos (coma). Añade previews de Vercel si los usas.
      - key: CORS_ORIGINS
        value: "https://banka-app-tracker.vercel.app,http://localhost:4200"
      # Secreto para POST /GET/investment/refresh-benchmark-cache (cron-job.org, GitHub Actions, etc.)
      - key: BENCHMARK_CACHE_CRON_SECRET
        sync: false
