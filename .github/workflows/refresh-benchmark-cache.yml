# Llama al backend en Render (plan Free). Añade el secret BENCHMARK_CACHE_CRON_SECRET en GitHub.
name: Refresh investment benchmark cache

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: POST refresh endpoint
        env:
          CRON_SECRET: ${{ secrets.BENCHMARK_CACHE_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Falta secret BENCHMARK_CACHE_CRON_SECRET en el repo"
            exit 1
          fi
          curl -fsS -X POST \
            "https://bankaapptracker.onrender.com/GET/investment/refresh-benchmark-cache" \
            -H "X-Cron-Secret: ${CRON_SECRET}"
